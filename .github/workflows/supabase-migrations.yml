# Applies new files in supabase/migrations to the production database (project caogiacafe)
# whenever they reach main. Needs repository secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.
# The site tolerates a migration landing a little after the Vercel deploy (missing columns/tables
# are handled in code), so the two run independently.
name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

# Never run two pushes against the database at the same time.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: bevtazcodyajyzntsich
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

      - name: Pending migrations
        run: supabase db push --dry-run -p "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: supabase db push --yes -p "$SUPABASE_DB_PASSWORD"
